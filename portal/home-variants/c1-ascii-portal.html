<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C1 · ASCII × Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     COMBO 1 — ASCII MIRROR × PORTAL SHADER
     You are the room, rendered as mint text; the portal aperture
     burns through the middle of you. The vignette darkens the
     ASCII world outside the ring so the portal is what lights it.
     ============================================================ */
  * { box-sizing: border-box; margin: 0; }
  :root { --bg: #05060a; --fg: #eef0f6; --muted: #79809299; --accent: #00ffb4; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; overflow: hidden; }

  canvas#ascii { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  /* outside the aperture the text-world falls into shadow */
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 50%,
      transparent 26%, rgba(5, 6, 10, 0.55) 46%, rgba(5, 6, 10, 0.9) 78%);
    z-index: 1;
  }

  /* the ring: black canvas screen-blended, so only its light lands */
  canvas#portal {
    position: fixed; inset: 0; width: 100vw; height: 100vh; display: block;
    mix-blend-mode: screen; z-index: 2; pointer-events: none;
  }

  .content {
    position: fixed; inset: 0; z-index: 3;
    display: grid; align-content: center; justify-items: center; gap: 20px;
    text-align: center; padding: 24px;
  }
  h1 {
    font-family: Unbounded, sans-serif; font-weight: 800;
    font-size: clamp(38px, 7.4vw, 84px); line-height: 1; letter-spacing: -0.02em;
    user-select: none; cursor: default;
    text-shadow: 0 0 40px rgba(255, 60, 170, 0.45), 0 0 90px rgba(0, 200, 255, 0.3);
  }
  .tag {
    max-width: 44ch; font-size: clamp(15px, 2vw, 18px); line-height: 1.55;
    color: #b9bfd0; text-shadow: 0 1px 12px rgba(0, 0, 0, 0.85);
  }
  .key-note {
    font-family: ui-monospace, monospace; font-size: 12.5px; letter-spacing: 0.05em;
    color: #a7aec0; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.95), 0 0 18px rgba(0, 0, 0, 0.9);
  }
  button {
    margin-top: 8px; font: 500 15.5px/1 Inter, sans-serif; color: var(--bg);
    background: var(--fg); border: none; border-radius: 999px; padding: 15px 32px;
    cursor: pointer;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.14), 0 0 34px rgba(255,60,170,0.35), 0 0 80px rgba(0,200,255,0.18);
    transition: box-shadow 0.25s ease, transform 0.15s ease;
  }
  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.2), 0 0 46px rgba(255,60,170,0.6), 0 0 110px rgba(0,200,255,0.35);
  }
  button:active { transform: translateY(1px); }

  .cam-note {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.22em;
    text-transform: uppercase; color: rgba(138, 144, 160, 0.55); z-index: 3; white-space: nowrap;
  }
</style>
</head>
<body>
  <canvas id="ascii"></canvas>
  <div class="vignette"></div>
  <canvas id="portal"></canvas>

  <div class="content">
    <h1 id="title">VerseJumper</h1>
    <p class="tag">Open a portal with your hands and jump between Spider-Verse
      dimensions — live.</p>
    <p class="key-note">Set DECART API KEY at portal/.env.local</p>
    <button id="start-lucy">Start multiverse-hopping</button>
  </div>

  <div class="cam-note" id="cam-note">camera stays on this machine — nothing streams until you start</div>

<script>
/* ---- ASCII mirror layer ---- */
const ascii = document.getElementById('ascii');
const actx = ascii.getContext('2d');
const note = document.getElementById('cam-note');
const RAMP = ' .:-=+*#%@';
const CELL_W = 9, CELL_H = 15;
let cols = 0, rows = 0;
const sampler = document.createElement('canvas');
const sctx = sampler.getContext('2d', { willReadFrequently: true });
const video = document.createElement('video');
video.muted = true; video.playsInline = true;

function resizeAscii() {
  ascii.width = innerWidth; ascii.height = innerHeight;
  cols = Math.ceil(innerWidth / CELL_W); rows = Math.ceil(innerHeight / CELL_H);
  sampler.width = cols; sampler.height = rows;
}

function asciiFrame() {
  if (video.readyState >= 2) {
    const va = video.videoWidth / video.videoHeight;
    const ca = ascii.width / ascii.height;
    let sw = video.videoWidth, sh = video.videoHeight, sx = 0, sy = 0;
    if (va > ca) { sw = sh * ca; sx = (video.videoWidth - sw) / 2; }
    else { sh = sw / ca; sy = (video.videoHeight - sh) / 2; }
    sctx.save(); sctx.scale(-1, 1);
    sctx.drawImage(video, sx, sy, sw, sh, -cols, 0, cols, rows);
    sctx.restore();
    const px = sctx.getImageData(0, 0, cols, rows).data;
    // Auto-exposure: gain a dim room toward a healthy midtone (see V8).
    const lums = new Float32Array(cols * rows);
    let sum = 0;
    for (let c = 0, i = 0; c < lums.length; c++, i += 4) {
      const l = (0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]) / 255;
      lums[c] = l; sum += l;
    }
    const gain = Math.min(6, Math.max(1, 0.45 / (sum / lums.length + 0.001)));
    actx.setTransform(1, 0, 0, 1, 0, 0);
    actx.fillStyle = '#05060a';
    actx.fillRect(0, 0, ascii.width, ascii.height);
    actx.font = `${CELL_H - 2}px ui-monospace, Menlo, monospace`;
    actx.textBaseline = 'top';
    // The font's natural advance is narrower than CELL_W, which left a dead
    // band at the right edge — scale x so one glyph lands on exactly one cell.
    const adv = actx.measureText('M').width || CELL_W;
    actx.setTransform(CELL_W / adv, 0, 0, 1, 0, 0);
    for (let pass = 0; pass < 2; pass++) {
      actx.fillStyle = pass === 0 ? 'rgba(0, 255, 180, 0.34)' : 'rgba(0, 255, 180, 0.9)';
      for (let y = 0; y < rows; y++) {
        let line = '';
        for (let x = 0; x < cols; x++) {
          const lum = Math.min(1, lums[y * cols + x] * gain);
          const idx = Math.min(RAMP.length - 1, Math.floor(lum * RAMP.length));
          const bright = lum > 0.62;
          line += (pass === 0 ? !bright : bright) ? RAMP[idx] : ' ';
        }
        actx.fillText(line, 0, y * CELL_H);
      }
    }
  }
  requestAnimationFrame(asciiFrame);
}

// Raced against a timeout: with the camera held open by other tabs, Chrome
// can leave this promise pending forever rather than rejecting it.
Promise.race([
  navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 360 } }),
  new Promise((_, rej) => setTimeout(() => rej(new Error('camera busy')), 6000)),
])
  .then(s => { video.srcObject = s; return video.play(); })
  .then(() => requestAnimationFrame(asciiFrame))
  .catch(() => { note.textContent = 'camera unavailable or busy — close other tabs using it, then reload'; });

/* ---- portal ring layer (screen-blended: black stays invisible) ---- */
const portal = document.getElementById('portal');
const gl = portal.getContext('webgl', { antialias: false });
const VERT = 'attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }';
const FRAG = `
precision highp float;
uniform vec2 res; uniform float t;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float v=0., a=.5;
  for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.03+vec2(17.,9.2); a*=.5; } return v; }
void main(){
  vec2 uv = (gl_FragCoord.xy - .5*res) / min(res.x, res.y);
  float r = length(uv); float ang = atan(uv.y, uv.x);
  float swirl = ang + 1.4*exp(-2.2*r)*sin(t*.22) + .55*fbm(uv*2.2 + t*.06);
  float wobble = .06*fbm(vec2(swirl*2., r*5. - t*.12));
  float ring = abs(r - .34 + wobble);
  float glow = exp(-ring*9.); float core = exp(-ring*26.);
  vec3 magenta = vec3(1.,.16,.62); vec3 cyan = vec3(0.,.82,1.); vec3 amber = vec3(1.,.62,.12);
  float k = .5+.5*sin(swirl*3. + t*.35); float k2 = .5+.5*sin(swirl*3. - 2.1 + t*.22);
  vec3 col = mix(magenta, cyan, k); col = mix(col, amber, .35*k2);
  vec3 outCol = col * (glow*.5 + core*1.15);
  outCol += (hash(gl_FragCoord.xy + t) - .5) * .02;
  gl_FragColor = vec4(max(outCol, 0.), 1.);
}`;
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src);
  gl.compileShader(s); if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const uRes = gl.getUniformLocation(prog, 'res');
const uT = gl.getUniformLocation(prog, 't');
function resizePortal(){
  portal.width = Math.floor(innerWidth/2); portal.height = Math.floor(innerHeight/2);
  gl.viewport(0, 0, portal.width, portal.height);
}
function portalFrame(ms){
  gl.uniform2f(uRes, portal.width, portal.height);
  gl.uniform1f(uT, ms/1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(portalFrame);
}
addEventListener('resize', () => { resizeAscii(); resizePortal(); });
resizeAscii(); resizePortal();
requestAnimationFrame(portalFrame);
</script>
</body>
</html>
