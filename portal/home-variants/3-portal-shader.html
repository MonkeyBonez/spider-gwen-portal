<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>V3 · Portal Shader</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     VARIANT 3 — "THE PORTAL IS ALREADY OPEN"
     A raw-WebGL fragment shader paints a slowly swirling
     dimensional aperture in the middle of the room; the text sits
     inside its glow. No libraries — ~90 lines of GLSL.
     Signature element: the living portal.
     ============================================================ */
  * { box-sizing: border-box; margin: 0; }

  :root {
    --bg: #05060a;
    --fg: #eef0f6;
    --muted: #79809273;
    --accent: #00ffb4;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Inter, system-ui, sans-serif;
    overflow: hidden;
  }

  canvas#portal {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }

  .content {
    position: fixed;
    inset: 0;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: 20px;
    text-align: center;
    padding: 24px;
    z-index: 2;
  }

  h1 {
    font-family: Unbounded, sans-serif;
    font-weight: 800;
    font-size: clamp(38px, 7.4vw, 84px);
    line-height: 1;
    letter-spacing: -0.02em;
    user-select: none;
    cursor: default;
    /* lit from behind by the portal */
    text-shadow:
      0 0 40px rgba(255, 60, 170, 0.45),
      0 0 90px rgba(0, 200, 255, 0.3);
  }

  .tag {
    max-width: 44ch;
    font-size: clamp(15px, 2vw, 18px);
    line-height: 1.55;
    color: #b9bfd0;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.8);
  }

  .key-note {
    font-family: ui-monospace, monospace;
    font-size: 12.5px;
    letter-spacing: 0.05em;
    color: #a7aec0;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.95), 0 0 18px rgba(0, 0, 0, 0.9);
  }

  button {
    margin-top: 8px;
    font: 500 15.5px/1 Inter, sans-serif;
    letter-spacing: 0.01em;
    color: var(--bg);
    background: var(--fg);
    border: none;
    border-radius: 999px;
    padding: 15px 32px;
    cursor: pointer;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.14),
      0 0 34px rgba(255, 60, 170, 0.35),
      0 0 80px rgba(0, 200, 255, 0.18);
    transition: box-shadow 0.25s ease, transform 0.15s ease;
  }
  button:hover {
    transform: translateY(-1px);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.2),
      0 0 46px rgba(255, 60, 170, 0.6),
      0 0 110px rgba(0, 200, 255, 0.35);
  }
  button:active { transform: translateY(1px); }
</style>
</head>
<body>
  <canvas id="portal"></canvas>

  <div class="content">
    <h1 id="title">VerseJumper</h1>
    <p class="tag">Open a portal with your hands and jump between Spider-Verse
      dimensions — live.</p>
    <p class="key-note">Set DECART API KEY at portal/.env.local</p>
    <button id="start-lucy">Start multiverse-hopping</button>
  </div>

<script>
const canvas = document.getElementById('portal');
const gl = canvas.getContext('webgl', { antialias: false });

const VERT = `
attribute vec2 p;
void main() { gl_Position = vec4(p, 0.0, 1.0); }
`;

// A ring of layered, swirling value-noise — ink dropped in water, spun.
// Colour ramps through the Spider-Verse trio: magenta, orange, cyan.
const FRAG = `
precision highp float;
uniform vec2 res;
uniform float t;

float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x),
             mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) {
    v += a * noise(p);
    p = p * 2.03 + vec2(17.0, 9.2);
    a *= 0.5;
  }
  return v;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * res) / min(res.x, res.y);
  float r = length(uv);
  float ang = atan(uv.y, uv.x);

  // swirl: rotation increases toward the centre
  float swirl = ang + 1.4 * exp(-2.2 * r) * sin(t * 0.22)
              + 0.55 * fbm(uv * 2.2 + t * 0.06);

  // the aperture: a soft ring around r ~= 0.34, edges eaten by noise
  float wobble = 0.06 * fbm(vec2(swirl * 2.0, r * 5.0 - t * 0.12));
  float ring = abs(r - 0.34 + wobble);
  float glow = exp(-ring * 9.0);          // wide outer glow
  float core = exp(-ring * 26.0);         // bright rim

  // colour cycles around the ring through the trio
  vec3 magenta = vec3(1.0, 0.16, 0.62);
  vec3 cyan    = vec3(0.0, 0.82, 1.0);
  vec3 amber   = vec3(1.0, 0.62, 0.12);
  float k = 0.5 + 0.5 * sin(swirl * 3.0 + t * 0.35);
  float k2 = 0.5 + 0.5 * sin(swirl * 3.0 - 2.1 + t * 0.22);
  vec3 col = mix(magenta, cyan, k);
  col = mix(col, amber, 0.35 * k2);

  // interior: darker, star-flecked other-side
  float inside = smoothstep(0.34 + wobble, 0.10, r);
  float stars = pow(noise(uv * 60.0 + floor(t * 0.5) * 7.0), 18.0) * 5.0;
  vec3 interior = mix(vec3(0.01, 0.015, 0.03), vec3(0.05, 0.02, 0.1), r * 3.0)
                + stars * vec3(0.6, 0.8, 1.0);

  vec3 outCol = col * (glow * 0.55 + core * 1.15);
  outCol += interior * inside;

  // room falloff so corners go properly black
  outCol *= 1.0 - smoothstep(0.55, 1.05, r) * 0.85;

  // fine grain so the gradient never bands
  outCol += (hash(gl_FragCoord.xy + t) - 0.5) * 0.02;

  gl_FragColor = vec4(outCol, 1.0);
}
`;

function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'res');
const uT = gl.getUniformLocation(prog, 't');

function resize() {
  // Half-resolution: the shader is all soft gradients, and this keeps it
  // cheap on battery. CSS stretches it back up invisibly.
  canvas.width = Math.floor(innerWidth / 2);
  canvas.height = Math.floor(innerHeight / 2);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize);
resize();

function frame(ms) {
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uT, ms / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
