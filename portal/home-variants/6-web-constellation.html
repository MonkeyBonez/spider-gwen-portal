<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>V6 · Web Constellation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     VARIANT 6 — "THE WEB"
     The quietest of the seven: the app's existing dark room and
     mint accent, plus one signature element — a drifting
     constellation whose threads knit into a web around the
     cursor, the way the portal knits around your hands.
     ============================================================ */
  * { box-sizing: border-box; margin: 0; }

  :root {
    --bg: #0a0b0f;
    --fg: #e7e9ee;
    --muted: #8a90a0;
    --accent: #00ffb4;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Inter, system-ui, sans-serif;
    overflow: hidden;
  }

  canvas#web {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }

  .content {
    position: fixed;
    inset: 0;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: 18px;
    text-align: center;
    padding: 24px;
    z-index: 2;
    pointer-events: none; /* let the web feel the cursor everywhere */
  }
  .content > * { pointer-events: auto; }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(44px, 8.5vw, 96px);
    line-height: 1;
    letter-spacing: -0.045em;
    user-select: none;
    cursor: default;
  }
  h1 em {
    font-style: normal;
    color: var(--accent);
  }

  .tag {
    max-width: 44ch;
    font-size: clamp(15px, 2vw, 18px);
    line-height: 1.55;
    color: var(--muted);
  }

  .key-note {
    font-family: ui-monospace, monospace;
    font-size: 12.5px;
    letter-spacing: 0.05em;
    color: #5d6373;
  }

  button {
    margin-top: 10px;
    font: 500 15.5px/1 Inter, sans-serif;
    color: var(--bg);
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 15px 32px;
    cursor: pointer;
    box-shadow: 0 0 0 0 rgba(0, 255, 180, 0.4);
    transition: box-shadow 0.3s ease, transform 0.15s ease;
  }
  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 0 6px rgba(0, 255, 180, 0.12), 0 0 40px rgba(0, 255, 180, 0.25);
  }
  button:active { transform: translateY(1px); }
</style>
</head>
<body>
  <canvas id="web"></canvas>

  <div class="content">
    <h1 id="title">Verse<em>Jumper</em></h1>
    <p class="tag">Open a portal with your hands and jump between Spider-Verse
      dimensions — live.</p>
    <p class="key-note">Set DECART API KEY at portal/.env.local</p>
    <button id="start-lucy">Start multiverse-hopping</button>
  </div>

<script>
const canvas = document.getElementById('web');
const ctx = canvas.getContext('2d');
let W, H, DPR;

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize);
resize();

// Density scales with area so a phone is not a solid mat of lines.
const COUNT = Math.min(110, Math.floor((W * H) / 16000));
const LINK = 130;          // px within which two nodes thread together
const MOUSE_LINK = 190;    // the cursor gets longer threads — it is the spider

const nodes = Array.from({ length: COUNT }, () => ({
  x: Math.random() * W,
  y: Math.random() * H,
  vx: (Math.random() - 0.5) * 0.25,
  vy: (Math.random() - 0.5) * 0.25,
  r: 1 + Math.random() * 1.6,
}));

const mouse = { x: -9999, y: -9999 };
addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('pointerleave', () => { mouse.x = -9999; mouse.y = -9999; });

function frame() {
  ctx.clearRect(0, 0, W, H);

  for (const n of nodes) {
    n.x += n.vx; n.y += n.vy;
    if (n.x < 0 || n.x > W) n.vx *= -1;
    if (n.y < 0 || n.y > H) n.vy *= -1;
  }

  // threads between close nodes — mint, fading with distance
  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) {
      const b = nodes[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const d2 = dx * dx + dy * dy;
      if (d2 > LINK * LINK) continue;
      const t = 1 - Math.sqrt(d2) / LINK;
      ctx.strokeStyle = `rgba(0, 255, 180, ${0.14 * t})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    // thread to the cursor, brighter — the web notices you
    const mdx = a.x - mouse.x, mdy = a.y - mouse.y;
    const md2 = mdx * mdx + mdy * mdy;
    if (md2 < MOUSE_LINK * MOUSE_LINK) {
      const t = 1 - Math.sqrt(md2) / MOUSE_LINK;
      ctx.strokeStyle = `rgba(0, 255, 180, ${0.4 * t})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(mouse.x, mouse.y);
      ctx.stroke();
      // and leans toward you, gently
      a.vx -= mdx * 0.000012;
      a.vy -= mdy * 0.000012;
    }
  }

  // the nodes themselves: dim dust, so the threads are the show
  for (const n of nodes) {
    ctx.fillStyle = 'rgba(231, 233, 238, 0.35)';
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
