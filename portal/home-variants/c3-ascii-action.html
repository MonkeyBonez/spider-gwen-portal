<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C3 · ASCII × Action</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     COMBO 3 — ASCII MIRROR × ACTION PAGE
     The comic's night sky is you: the webcam renders as yellow
     print-glyphs over the purple, the speed lines converge on
     the starburst, and the whole page is mid-panel.
     ============================================================ */
  * { box-sizing: border-box; margin: 0; }
  :root {
    --night: #131048; --night2: #2a0f5e; --paper: #fff8ec; --ink: #16151c;
    --red: #ff3d2e; --yellow: #ffd400; --cyan: #29d9ff; --pink: #ff2e88;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 110%, var(--night2) 0%, var(--night) 55%, #0a0830 100%);
    font-family: Barlow, system-ui, sans-serif;
    overflow: hidden; color: var(--paper);
  }

  canvas#ascii {
    position: fixed; inset: 0; width: 100vw; height: 100vh; display: block;
  }

  .lines, .lines2 {
    position: fixed; left: 50%; top: 78%;
    width: 300vmax; height: 300vmax;
    transform: translate(-50%, -50%);
    pointer-events: none; z-index: 1;
  }
  .lines {
    background: repeating-conic-gradient(from 0deg,
      rgba(19, 16, 72, 0.5) 0deg 1.1deg, transparent 1.1deg 7deg);
  }
  .lines2 {
    background: repeating-conic-gradient(from 3.2deg,
      rgba(41, 217, 255, 0.05) 0deg 0.7deg, transparent 0.7deg 11deg);
    animation: spin 90s linear infinite;
  }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

  .page {
    position: fixed; inset: 0; z-index: 2;
    display: grid; align-content: center; justify-items: center;
    gap: clamp(18px, 3.6vh, 34px);
    text-align: center; padding: 24px;
  }
  h1 {
    font-family: Bangers, Impact, sans-serif; font-weight: 400;
    font-size: clamp(64px, 14vw, 138px); line-height: 0.92; letter-spacing: 0.02em;
    color: var(--yellow); user-select: none; cursor: default; transform: rotate(-3deg);
    -webkit-text-stroke: 3px var(--ink);
    text-shadow: 4px 4px 0 var(--ink), 8px 8px 0 var(--red), 12px 12px 0 var(--ink);
  }
  .panel {
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.5);
    padding: 13px 22px; max-width: 46ch;
    font-size: clamp(14.5px, 2vw, 17px); font-weight: 600; line-height: 1.45;
    transform: rotate(1.4deg);
  }
  .key-note {
    font-family: ui-monospace, monospace; font-size: 12px; letter-spacing: 0.05em;
    color: rgba(255, 248, 236, 0.75); transform: rotate(-0.6deg);
    position: relative; z-index: 3;
    text-shadow: 0 1px 6px rgba(10, 8, 48, 0.9), 0 0 14px rgba(10, 8, 48, 0.8);
  }

  .burst-wrap { position: relative; margin-top: clamp(4px, 2vh, 18px); display: grid; place-items: center; }
  .burst-wrap::before, .burst-wrap::after {
    content: ''; position: absolute; width: 180%; height: 240%; z-index: -1;
    clip-path: polygon(50% 0%, 59% 27%, 85% 12%, 72% 38%, 100% 40%, 76% 57%,
      95% 78%, 65% 70%, 62% 100%, 50% 74%, 38% 100%, 35% 70%,
      5% 78%, 24% 57%, 0% 40%, 28% 38%, 15% 12%, 41% 27%);
  }
  .burst-wrap::before { background: var(--red); transform: rotate(10deg) scale(1.14); }
  .burst-wrap::after { background: var(--yellow); transform: rotate(-6deg); }
  button {
    font-family: Bangers, Impact, sans-serif;
    font-size: clamp(24px, 4.4vw, 34px); letter-spacing: 0.05em;
    color: var(--ink); background: transparent; border: none;
    padding: 26px 30px; cursor: pointer; transform: rotate(-2deg);
    transition: transform 0.1s ease;
  }
  .burst-wrap:hover { animation: pow 0.35s ease; }
  .burst-wrap:hover button { transform: rotate(-2deg) scale(1.06); }
  button:active { transform: rotate(-2deg) scale(0.95); }
  @keyframes pow { 0% { transform: scale(1); } 40% { transform: scale(1.07) rotate(1.5deg); } 100% { transform: scale(1); } }

  .fx {
    position: fixed; font-family: Bangers, Impact, sans-serif;
    color: var(--cyan); -webkit-text-stroke: 2px var(--ink);
    text-shadow: 3px 3px 0 var(--ink);
    user-select: none; pointer-events: none; z-index: 1;
  }
  .fx.thwip { top: 9%; right: 7%; font-size: clamp(26px, 4.6vw, 48px); transform: rotate(9deg); color: var(--pink); }
  .fx.vwomm { bottom: 9%; left: 6%; font-size: clamp(22px, 3.8vw, 40px); transform: rotate(-8deg); }

  .cam-note {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(255, 248, 236, 0.45); z-index: 3; white-space: nowrap;
  }
</style>
</head>
<body>
  <canvas id="ascii"></canvas>
  <div class="lines"></div>
  <div class="lines2"></div>
  <div class="fx thwip">THWIP!</div>
  <div class="fx vwomm">VWOMM…</div>

  <main class="page">
    <h1 id="title">VerseJumper</h1>
    <p class="panel">Open a portal with your hands and jump between Spider-Verse
      dimensions — live.</p>
    <p class="key-note">Set DECART API KEY at portal/.env.local</p>
    <div class="burst-wrap">
      <button id="start-lucy">Start multiverse-hopping</button>
    </div>
  </main>

  <div class="cam-note" id="cam-note">camera stays on this machine — nothing streams until you start</div>

<script>
const ascii = document.getElementById('ascii');
const actx = ascii.getContext('2d');
const note = document.getElementById('cam-note');
const RAMP = ' .:-=+*#%@';
const CELL_W = 9, CELL_H = 15;
let cols = 0, rows = 0;
const sampler = document.createElement('canvas');
const sctx = sampler.getContext('2d', { willReadFrequently: true });
const video = document.createElement('video');
video.muted = true; video.playsInline = true;

function resize() {
  ascii.width = innerWidth; ascii.height = innerHeight;
  cols = Math.ceil(innerWidth / CELL_W); rows = Math.ceil(innerHeight / CELL_H);
  sampler.width = cols; sampler.height = rows;
}
addEventListener('resize', resize);
resize();

function frame() {
  if (video.readyState >= 2) {
    const va = video.videoWidth / video.videoHeight;
    const ca = ascii.width / ascii.height;
    let sw = video.videoWidth, sh = video.videoHeight, sx = 0, sy = 0;
    if (va > ca) { sw = sh * ca; sx = (video.videoWidth - sw) / 2; }
    else { sh = sw / ca; sy = (video.videoHeight - sh) / 2; }
    sctx.save(); sctx.scale(-1, 1);
    sctx.drawImage(video, sx, sy, sw, sh, -cols, 0, cols, rows);
    sctx.restore();
    const px = sctx.getImageData(0, 0, cols, rows).data;
    // Auto-exposure: gain a dim room toward a healthy midtone (see V8).
    const lums = new Float32Array(cols * rows);
    let sum = 0;
    for (let c = 0, i = 0; c < lums.length; c++, i += 4) {
      const l = (0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]) / 255;
      lums[c] = l; sum += l;
    }
    const gain = Math.min(6, Math.max(1, 0.45 / (sum / lums.length + 0.001)));

    // transparent clear: the comic-night gradient shows through the glyphs
    actx.setTransform(1, 0, 0, 1, 0, 0);
    actx.clearRect(0, 0, ascii.width, ascii.height);
    actx.font = `${CELL_H - 2}px ui-monospace, Menlo, monospace`;
    actx.textBaseline = 'top';
    // The font's natural advance is narrower than CELL_W, which left a dead
    // band at the right edge — scale x so one glyph lands on exactly one cell.
    const adv = actx.measureText('M').width || CELL_W;
    actx.setTransform(CELL_W / adv, 0, 0, 1, 0, 0);
    // print-ink palette: faint paper glyphs, the brightest hits in yellow
    for (let pass = 0; pass < 2; pass++) {
      actx.fillStyle = pass === 0 ? 'rgba(255, 248, 236, 0.22)' : 'rgba(255, 212, 0, 0.66)';
      for (let y = 0; y < rows; y++) {
        let line = '';
        for (let x = 0; x < cols; x++) {
          const lum = Math.min(1, lums[y * cols + x] * gain);
          const idx = Math.min(RAMP.length - 1, Math.floor(lum * RAMP.length));
          const bright = lum > 0.62;
          line += (pass === 0 ? !bright : bright) ? RAMP[idx] : ' ';
        }
        actx.fillText(line, 0, y * CELL_H);
      }
    }
  }
  requestAnimationFrame(frame);
}

// Raced against a timeout: with the camera held open by other tabs, Chrome
// can leave this promise pending forever rather than rejecting it.
Promise.race([
  navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 360 } }),
  new Promise((_, rej) => setTimeout(() => rej(new Error('camera busy')), 6000)),
])
  .then(s => { video.srcObject = s; return video.play(); })
  .then(() => requestAnimationFrame(frame))
  .catch(() => { note.textContent = 'camera unavailable or busy — close other tabs using it, then reload'; });
</script>
</body>
</html>
